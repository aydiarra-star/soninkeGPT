name: Deploy SoninkeGPT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test authentic voice playback
        run: node tests/voice.test.cjs
      - name: Refuser tout doublon dans le lexique
        run: python3 scripts/check_doublons_lexique.py --strict
      - name: Build lexical voice memory
        run: python3 scripts/generate_voice.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish website
        uses: actions/deploy-pages@v4
