name: Build authentic voice memory
concurrency:
  group: soninkegpt-voice-generation
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      batch_limit:
        description: "Nombre maximal de nouveaux WAV à produire"
        required: true
        default: "100"
        type: choice
        options:
          - "20"
          - "50"
          - "100"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier et indexer le lexique sans remplacer les audios existants
        run: python scripts/generate_voice.py

      - name: Cache Hugging Face model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: omnivoice-hf-${{ runner.os }}-k2-fsa-OmniVoice-v1

      - name: Installer OmniVoice et les dépendances audio
        run: |
          python -m pip install --upgrade pip
          python -m pip install soundfile numpy
          python -m pip install omnivoice || python -m pip install git+https://github.com/k2-fsa/OmniVoice.git

      - name: Générer les mots manquants avec les références vocales authentiques
        run: python scripts/generate_voice.py --generate --device cpu --limit ${{ inputs.batch_limit }}

      - name: Vérifier les fichiers audio générés
        if: always()
        run: |
          python - <<'PY'
          import os, wave, glob, sys
          files = sorted(glob.glob("audio/generated/*.wav"))
          good, bad = 0, []
          for path in files:
              try:
                  with wave.open(path, "rb") as wav:
                      if wav.getnframes() < 1 or wav.getframerate() < 1 or wav.getnchannels() < 1:
                          raise ValueError("WAV vide ou paramètres audio invalides")
                  good += 1
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          print(f"WAV vérifiés: {len(files)}; techniquement lisibles: {good}; erreurs: {len(bad)}")
          for item in bad:
              print("ERREUR:", item)
          if bad:
              sys.exit(1)
          PY

      - name: Préparer le lot pour validation humaine
        if: always()
        run: |
          mkdir -p review-bundle
          [ ! -d audio/generated ] || cp -R audio/generated review-bundle/
          [ ! -f data/voice-memory.json ] || cp data/voice-memory.json review-bundle/
          [ ! -f data/voice-generation-errors.csv ] || cp data/voice-generation-errors.csv review-bundle/

      - name: Publier le lot comme artefact de validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soninkegpt-lot-${{ inputs.batch_limit }}-pour-validation
          path: review-bundle/
          if-no-files-found: warn
          retention-days: 30

      - name: Créer une branche de revue sans fusionner dans main
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: audio-review/omnivoice-${{ github.run_number }}
          base: main
          delete-branch: false
          title: "Revue humaine des audios Soninké — lot ${{ inputs.batch_limit }}"
          body: |
            Lot généré automatiquement avec les références vocales du projet.
            Les fichiers restent proposés dans cette branche/PR : aucune fusion automatique dans main.
            Écouter chaque audio et confirmer la prononciation avant toute fusion.
          commit-message: "Préparer le lot audio OmniVoice pour validation humaine"
          add-paths: |
            audio/generated/*.wav
            data/voice-memory.json
            data/voice-generation-errors.csv

      - name: Envoyer les fichiers vers Google Drive si les secrets sont configurés
        if: always()
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_REVIEW_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REVIEW_FOLDER_ID }}
        run: |
          if [ -z "$GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON" ] || [ -z "$GOOGLE_DRIVE_REVIEW_FOLDER_ID" ]; then
            echo "::warning::Google Drive non configuré. Le lot reste disponible dans les artefacts GitHub Actions."
            exit 0
          fi
          python -m pip install google-api-python-client google-auth
          python scripts/upload_review_to_drive.py
