name: Build authentic voice memory
on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.csv'
      - 'app.js'
      - 'scripts/generate_voice.py'
      - 'scripts/upload_review_to_drive.py'
      - 'audio/**'
      - '.github/workflows/voice-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/generate_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: voice-memory-queue
          path: data/voice-memory.json
  generate:
    if: vars.OMNIVOICE_GPU_ENABLED == 'true'
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install omnivoice soundfile numpy
      - name: Generate at most 100 missing WAVs
        run: python scripts/generate_voice.py --generate --limit 100
      - name: Upload review bundle
        uses: actions/upload-artifact@v4
        with:
          name: omnivoice-generated-review
          path: |
            audio/generated/
            data/voice-memory.json
      - name: Upload WAVs and manifest to Google Drive review folder
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_REVIEW_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REVIEW_FOLDER_ID }}
        run: |
          if [ -z "$GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON" ] || [ -z "$GOOGLE_DRIVE_REVIEW_FOLDER_ID" ]; then
            echo "::notice::Google Drive upload skipped. Configure GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON and GOOGLE_DRIVE_REVIEW_FOLDER_ID to enable it."
            exit 0
          fi
          python -m pip install google-api-python-client google-auth
          python scripts/upload_review_to_drive.py
