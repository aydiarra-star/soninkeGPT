name: Build authentic voice memory
concurrency:
  group: soninkegpt-voice-generation
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.csv'
      - 'app.js'
      - 'scripts/generate_voice.py'
      - 'scripts/upload_review_to_drive.py'
      - 'audio/**'
      - '.github/workflows/voice-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/generate_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: voice-memory-queue
          path: data/voice-memory.json
  generate:
    needs: index
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache Hugging Face model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: omnivoice-hf-${{ runner.os }}-k2-fsa-OmniVoice-v1
      - name: Install OmniVoice and audio dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install soundfile numpy
          python -m pip install omnivoice || python -m pip install git+https://github.com/k2-fsa/OmniVoice.git
      - name: Generate one batch of 20 missing Soninke audio with the two authentic references
        run: python scripts/generate_voice.py --generate --device cpu --limit 20
      - name: Upload audio bundle for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omnivoice-generated-review
          path: |
            audio/generated/
            data/voice-memory.json
            data/voice-generation-errors.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Upload WAVs and manifest to Google Drive review folder
        if: success()
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_REVIEW_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REVIEW_FOLDER_ID }}
        run: |
          if [ -z "$GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON" ] || [ -z "$GOOGLE_DRIVE_REVIEW_FOLDER_ID" ]; then
            echo "::warning::Google Drive upload skipped: required secrets are not configured. The review bundle remains available as a GitHub Actions artifact."
            exit 0
          fi
          python -m pip install google-api-python-client google-auth
          python scripts/upload_review_to_drive.py
