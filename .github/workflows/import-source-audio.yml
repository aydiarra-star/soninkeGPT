name: Import available Soninke WAV files from source repository

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "SoninkeGPT branch receiving the copied WAV files"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  import-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out SoninkeGPT target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ github.token }}
      - name: Import source audio and produce an audit report
        run: python3 scripts/import_source_audio.py
      - name: Commit real audio files and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio reports/audio-transfer-audit.csv reports/audio-transfer-summary.md
          if git diff --cached --quiet; then
            echo "No new audio files or audit changes to commit."
            exit 0
          fi
          git commit -m "Import available Soninke WAV assets with audit"
          git push origin "HEAD:${{ inputs.target_branch }}"
