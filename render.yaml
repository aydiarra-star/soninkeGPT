services:
  - type: web
    name: soninkegpt-voice-api
    runtime: python
    plan: free
    rootDir: voice_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://aydiarra-star.github.io,http://localhost:8000,http://127.0.0.1:8000
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: whisper-1
